# The GPUI desktop app (desktop/: the runner connection and the app) on
# Linux, Mac and Windows: every Rust test (including signing in to the mock
# runner), the behaviour specs in features/ against a real window, and a build
# for each to download from the run's artifacts.
# Nothing is signed: the Mac app needs right-click Open the first time, and
# Windows SmartScreen asks once.
#
# When its last run on main failed, tb red-watch starts a thread to fix it
# and tb land says so (runner/src/red-watch.ts, docs/thread-worktrees.md): it
# was red for two days of GPUI landings (10 to 12 Nov) over what only
# GitHub's Macs, Linux and Windows see, which tb land's quick check on Tinker
# Desk can't.
#
# The paths are everything the app builds and tests from, the files outside
# desktop/ included (the mock runner, the pictures, pele.js and cases in
# shared/, the runner files the mock runner imports):
# runner/test/unit/desktop-ci-paths.test.ts finds those in the code and fails
# when one's missing here, as a change to only them ran no desktop CI.
# tb land: hold while red
name: Desktop app

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - rust-toolchain.toml
      - runner/src/protocol.ts
      - runner/src/rpc-auth.ts
      - runner/src/reviews.ts
      - runner/src/samples.ts
      - runner/src/well-formed-json.ts
      - web/src/sections.ts
      - web/src/format.ts
      - mock-runner/**
      - shared/**
      - site/app-doc-slugs.json
      - features/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - rust-toolchain.toml
      - runner/src/protocol.ts
      - runner/src/rpc-auth.ts
      - runner/src/reviews.ts
      - runner/src/samples.ts
      - runner/src/well-formed-json.ts
      - web/src/sections.ts
      - web/src/format.ts
      - mock-runner/**
      - shared/**
      - site/app-doc-slugs.json
      - features/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

# A PR's newer push cancels its run in progress. Main's don't: on 12 Nov main
# was pushed about every 7 minutes, each run takes about 40, and every run was
# cancelled by the next, so main went hours with no verdict and tb land's gate
# held on an old red one. Now main's runs go one at a time; GitHub keeps one
# waiting per group and a newer push replaces it, so a busy morning batches
# into the newest commit rather than piling up Mac and Windows minutes.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only in Mike's repo (or when started by hand): in a fork, a push of its
# main ran every job here on Linux, Mac, Windows and Android, though its
# owner only builds and checks for their own system (./check.sh does that
# before tb land), and most of those runs went red for reasons that were
# never theirs (Wayne, 19 Nov 2026; 9 forks had Actions on). PRs to Mike's
# repo still run, as they run in his repo.
jobs:
  build:
    if: github.repository == 'mikecann/threadbear' || github.event_name == 'workflow_dispatch'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Windows needs time for its release build after the behaviour specs, and
    # the Mac for its web runtime specs (about 40 minutes without them).
    # Linux too since 17 Nov: its specs alone grew past 39 minutes, and 45
    # cancelled the run on main.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux's behaviour specs are split in two (TB_SHARD, features/cucumber.mjs):
        # run whole they took 28 to 31 minutes and then passed the 45 (17 Nov),
        # about 620 scenarios at three seconds each. The second job only builds
        # the app and runs its half, so a share is about 16 minutes. Split
        # further, with a third job, rather than raising the limit.
        # Mac and Windows the same since 20 Nov: their whole runs took 40
        # minutes after 15 of Rust tests, and Mac's passed the 60 while
        # building the release app, so no run on main finished and the land
        # gate went by an old failure (run 44661350867).
        include:
          - { name: Linux, os: ubuntu-24.04, shard: 1/2 }
          - { name: Linux specs 2 of 2, os: ubuntu-24.04, shard: 2/2, specsOnly: true }
          - { name: Mac, os: macos-26, shard: 1/2 }
          - { name: Mac specs 2 of 2, os: macos-26, shard: 2/2, specsOnly: true }
          - { name: Windows, os: windows-latest, shard: 1/2 }
          - { name: Windows specs 2 of 2, os: windows-latest, shard: 2/2, specsOnly: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The toolchain rust-toolchain.toml pins (rustfmt and clippy with it), as
      # the check hosts and tb land use, so a format or lint result is the
      # same here. GitHub's images have rustup; with no argument it installs
      # the file's toolchain.
      - name: Rust toolchain
        run: rustup toolchain install && rustc --version
      # Formatting is the same on every system, so Linux's first job checks it.
      - name: Rust formatting
        if: runner.os == 'Linux' && !matrix.specsOnly
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check || {
            echo "::error::desktop/ is not formatted as cargo fmt writes it. Fix: cd desktop && cargo fmt --all, then commit what it changed."
            exit 1
          }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          # The specs-only job builds less, so it keeps a cache of its own.
          key: ${{ matrix.specsOnly && 'specs-only' || '' }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        # xvfb, mesa and dbus are for the behaviour specs: a window with no screen.
        # Ubuntu's mirror sometimes stalls for an hour (23 Nov), so the network
        # parts of each try get a timeout and a stalled one is retried. Only the
        # download is timed: killing dpkg mid-setup (24 Nov) left it broken for
        # every retry, so each try first finishes whatever a killed one left.
        timeout-minutes: 15
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          pkgs="libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libvulkan-dev xvfb mesa-vulkan-drivers dbus-x11"
          for try in 1 2 3; do
            sudo dpkg --configure -a || true
            if timeout 240 sudo apt-get $apt_opts update \
              && timeout 360 sudo apt-get $apt_opts install -y --download-only $pkgs \
              && sudo apt-get $apt_opts install -y $pkgs; then
              exit 0
            fi
            echo "Installing the Linux libraries failed or stalled (try $try of 3), retrying"
            sleep 15
          done
          exit 1
      - name: Install the mock runner and the specs
        run: |
          npm ci --prefix mock-runner
          npm ci --prefix features
      - name: The specs line up with their steps
        working-directory: features
        run: node verify-pairing.mjs
      - name: The specs' steps typecheck
        working-directory: features
        run: npm run typecheck
      # Clippy with desktop/Cargo.toml's [workspace.lints], on Linux and the
      # Mac (each lints its own platform's code); a warning fails it.
      - name: Clippy
        if: runner.os != 'Windows' && !matrix.specsOnly
        run: |
          cargo clippy --locked --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings || {
            echo "::error::Clippy found problems. To see them: cd desktop && cargo clippy --workspace --all-targets -- -D warnings (desktop/Cargo.toml says what each lint is for)."
            exit 1
          }
      - name: Rust tests (with the mock runner)
        if: ${{ !matrix.specsOnly }}
        run: cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Native text bridge contract
        if: runner.os == 'macOS' && !matrix.specsOnly
        run: bash desktop/scripts/test-native-text.sh
      - name: File-drop regression tests
        if: ${{ !matrix.specsOnly }}
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation --test file_drop
      - name: GIF regression tests
        if: ${{ !matrix.specsOnly }}
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation --test gif_frames
      # The vendored Windows platform's own tests (desktop/vendor/gpui-pre-windows),
      # which the workspace's cargo test doesn't reach: where GPUI is told the
      # pointer went when it leaves the window, so hover and tooltips clear
      # (25 Nov).
      - name: Windows pointer-leave tests
        if: runner.os == 'Windows' && !matrix.specsOnly
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p gpui-pre-windows --lib pointer_left
      - name: Loader repaint and lifetime regressions
        if: ${{ !matrix.specsOnly }}
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation,frame-stats --bin threadbear-gpui spinner:: -- --list > loader-tests.txt
          cat loader-tests.txt
          count=$(awk '/^spinner::.*: test$/ { n++ } END { print n+0 }' loader-tests.txt)
          test "$count" -ge 10
          cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation,frame-stats --bin threadbear-gpui spinner::
          cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation,frame-stats --bin threadbear-gpui frame_stats::loader_probe_tests:: -- --list > loader-probe-tests.txt
          cat loader-probe-tests.txt
          count=$(awk '/^frame_stats::loader_probe_tests::.*: test$/ { n++ } END { print n+0 }' loader-probe-tests.txt)
          test "$count" -ge 1
          cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation,frame-stats --bin threadbear-gpui frame_stats::loader_probe_tests::
      # The app's unit tests that only build with the automation feature
      # (`#[cfg(all(test, feature = "automation"))]`, for gpui's test window
      # and events), which the plain cargo test above leaves out: until 23 Nov
      # those in reply_buttons, reply_links, rows, style and text_services
      # never ran here. Every test in the app, so a module gated that way
      # later runs too, built with the same features as the step above, so
      # nothing builds again. The list check fails if a module's tests drop
      # out of the build.
      - name: App unit tests behind the automation feature
        if: ${{ !matrix.specsOnly }}
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation,frame-stats --bin threadbear-gpui -- --list > automation-tests.txt
          for m in reply_buttons::clicks reply_links::probe_tests rows::across_tests style::group_hover_text_tests style::contrast_tests text_services::selection_tests; do
            grep -q "^$m::.*: test$" automation-tests.txt || { echo "::error::cargo test lists no $m:: tests with --features automation"; exit 1; }
          done
          cargo test --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation,frame-stats --bin threadbear-gpui
      # The web runtime's pinned archive, for the @web-runtime specs (web
      # panels, diagrams and pages in replies, file previews, installing the
      # runtime): without it all 30 were skipped, and cucumber counts a skip
      # as a pass (16 Nov). Kept in the Actions cache by its name and hash,
      # and checked against the pinned SHA-256 every run.
      - name: Web runtime archive key
        if: runner.os == 'macOS'
        id: web-runtime
        run: echo "key=$(desktop/scripts/web-runtime-archive.sh --key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'macOS'
        with:
          path: ~/web-runtime-archive
          key: web-runtime-${{ steps.web-runtime.outputs.key }}
      - name: Web runtime archive
        if: runner.os == 'macOS'
        run: echo "TB_WEB_RUNTIME_ARCHIVE=$(desktop/scripts/web-runtime-archive.sh ~/web-runtime-archive)" >> "$GITHUB_ENV"
      - name: Behaviour specs
        run: |
          cargo build --locked --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation
          cd features
          TB_APP=gpui TB_RETRY=1 TB_SHARD=${{ matrix.shard }} node_modules/.bin/cucumber-js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spec-reports-${{ matrix.name }}
          path: features/reports/
          if-no-files-found: ignore
      - name: Build the GPUI app
        if: ${{ !matrix.specsOnly }}
        run: cargo build --locked --release --manifest-path desktop/Cargo.toml -p threadbear-gpui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !matrix.specsOnly }}
        with:
          name: threadbear-desktop-${{ matrix.name }}
          path: |
            desktop/target/release/threadbear-gpui
            desktop/target/release/threadbear-gpui.exe
          if-no-files-found: error
