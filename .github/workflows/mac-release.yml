# The Mac GPUI app's release archive: for each release/YYYY-MM-DD tag Mike's
# runner pushes (or a manual run targeting one), an arm64 Threadbear GPUI.app
# zip goes on that tag's GitHub release, as threadbear-mac-arm64.zip, so
# https://github.com/mikecann/threadbear/releases/latest/download/threadbear-mac-arm64.zip
# always points to the newest downloadable Mac build.
#
# Ad-hoc signed with a designated requirement pinned to the bundle id (not
# notarized): right-click Open once on a fresh Mac, or strip quarantine. The
# bundle's build.json leaves checkout and origin empty so downloaded copies
# never try to update from CI's build folder and never report crashes to Mike's
# Sentry.
#
# Two-job build/publish split matching android.yml: the build job holds only a
# read-only token and hands the zip and its SHA-256 to `publish`, which runs no
# actions, checks nothing out, verifies the exact bytes and attaches them to
# the tag's release.
name: Mac release

on:
  push:
    tags: ['release/*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (e.g. release/2026-11-27; empty = newest release/* tag)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    if: github.repository == 'mikecann/threadbear' && (startsWith(github.ref, 'refs/tags/release/') || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      todo: ${{ steps.todo.outputs.yes }}
      sha256: ${{ steps.built.outputs.sha256 }}
      binary_sha256: ${{ steps.built.outputs.binary_sha256 }}
    steps:
      - name: Pick the release tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh api "repos/$GH_REPO/git/matching-refs/tags/release/" --jq '.[].ref' | sed 's#refs/tags/##' | sort | tail -1)"
          fi
          [[ "$tag" =~ ^release/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "Not a release/YYYY-MM-DD tag: $tag" >&2
            exit 1
          }
          gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Skip a release that has its Mac archive already
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx threadbear-mac-arm64.zip; then
            echo "$TAG already has threadbear-mac-arm64.zip."
          else
            echo "yes=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.todo.outputs.yes
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          persist-credentials: false

      - name: Rust toolchain
        if: steps.todo.outputs.yes
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.todo.outputs.yes
        with:
          workspaces: desktop
          key: mac-release

      - name: Build and bundle Threadbear GPUI.app
        id: built
        if: steps.todo.outputs.yes
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          day="${TAG#release/}"
          version="${day//-/.}"
          build="${day//-/}"
          cargo build --locked --release --manifest-path desktop/Cargo.toml -p threadbear-gpui
          bundle="$RUNNER_TEMP/Threadbear GPUI.app"
          THREADBEAR_BUILT_ON="github-macos" \
          THREADBEAR_PUBLIC_RELEASE=1 \
          THREADBEAR_BUNDLE_VERSION="$version" \
          THREADBEAR_BUNDLE_BUILD="$build" \
            desktop/scripts/make-bundle.sh desktop/target/release "$bundle"
          # Ensure older release tags (before make-bundle.sh knew THREADBEAR_PUBLIC_RELEASE)
          # still ship with the tag version and empty checkout/origin (no Sentry reports).
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$bundle/Contents/Info.plist"
          /usr/bin/python3 -I - "$bundle/Contents/Resources/build.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              info = json.load(f)
          info["checkout"] = ""
          info["origin"] = ""
          with open(path, "w") as f:
              json.dump(info, f, indent=2)
          PY
          codesign --force --timestamp=none --sign - \
            --requirements '=designated => identifier "com.mikerosoft.threadbear.desktop"' \
            "$bundle"
          codesign --verify --deep --strict "$bundle"
          mkdir -p "$RUNNER_TEMP/out"
          zip_path="$RUNNER_TEMP/out/threadbear-mac-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "$zip_path"
          zip_sha="$(shasum -a 256 "$zip_path" | awk '{print $1}')"
          bin_sha="$(shasum -a 256 "$bundle/Contents/MacOS/threadbear-gpui" | awk '{print $1}')"
          printf '%s  threadbear-mac-arm64.zip\n' "$zip_sha" > "$RUNNER_TEMP/out/threadbear-mac-arm64.sha256"
          echo "sha256=$zip_sha" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$bin_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Mac release archive ($TAG)"
            echo "- Version: \`$version\` (build \`$build\`)"
            echo "- Zip SHA-256: \`$zip_sha\`"
            echo "- \`Contents/MacOS/threadbear-gpui\` SHA-256: \`$bin_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.todo.outputs.yes
        with:
          name: mac-release-archive
          path: |
            ${{ runner.temp }}/out/threadbear-mac-arm64.zip
            ${{ runner.temp }}/out/threadbear-mac-arm64.sha256
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: mac
    if: github.repository == 'mikecann/threadbear' && needs.mac.outputs.todo && needs.mac.outputs.sha256 && needs.mac.outputs.tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: mac-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.mac.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No actions and nothing checked out: only GitHub's CLI and standard tools
      # run with the write token, verifying the exact archive built above.
      - name: Fetch and verify the Mac archive
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ needs.mac.outputs.sha256 }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name mac-release-archive --dir "$RUNNER_TEMP/out"
          got="$(sha256sum "$RUNNER_TEMP/out/threadbear-mac-arm64.zip" | cut -d' ' -f1)"
          [ "$got" = "$WANT" ] || { echo "The Mac archive's digest is $got, not the build's $WANT." >&2; exit 1; }
          grep -qx "${WANT}  threadbear-mac-arm64.zip" "$RUNNER_TEMP/out/threadbear-mac-arm64.sha256"

      - name: Attach it to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^release/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "Not a release/YYYY-MM-DD tag: $TAG" >&2
            exit 1
          }
          notes="Prebuilt apps for this release: threadbear-mac-arm64.zip (Apple Silicon Mac, ad-hoc signed) and threadbear-android.apk (Android)."
          newest="$(gh api "repos/$GH_REPO/git/matching-refs/tags/release/" --jq '.[].ref' | sed 's#refs/tags/##' | sort | tail -1)"
          latest=false; [ "$newest" = "$TAG" ] && latest=true
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" --latest="$latest" \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/out/threadbear-mac-arm64.zip" \
            "$RUNNER_TEMP/out/threadbear-mac-arm64.sha256"
