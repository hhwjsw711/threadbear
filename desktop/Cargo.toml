# The desktop app's Rust: the runner connection and the GPUI app, built
# together with one lock file and one target folder.
[workspace]
resolver = "2"
members = ["client", "core", "gpui", "dock", "dock/layout", "web"]
# A copy of a published crate, built as a dependency only (below).
exclude = ["vendor"]

# Clippy's default lints plus these, for every member (each has `[lints]
# workspace = true`). ../check.sh and the Desktop workflow run clippy with
# -D warnings, so a warning fails a landing too. clippy.toml has the settings.
[workspace.lints.clippy]
# Denied outright:
dbg_macro = "deny" # Debug printing left in; the log is the place for it.
todo = "deny" # Unfinished code that panics when reached.
unimplemented = "deny" # The same, under another name.
await_holding_lock = "deny" # A std lock held across an .await can stall the runtime or deadlock.
await_holding_refcell_ref = "deny" # A RefCell borrow held across an .await panics when another task borrows it.
rc_mutex = "deny" # Rc<Mutex<_>> pays for a lock that no other thread can reach; RefCell does it.
redundant_clone = "deny" # A clone of something never used again.
allow_attributes_without_reason = "deny" # Every exception to a lint says why, in its reason.
undocumented_unsafe_blocks = "deny" # Every unsafe block says why it's sound, in a // SAFETY: comment.
# Warned, with the sites there were marked #[expect(..., reason = "...")], so
# the list only shrinks (a site that's fixed fails its expect):
unwrap_used = "warn" # A panic with no message where an error could be handled or said.
expect_used = "warn" # A panic where an error could be handled; tests may (clippy.toml).
too_many_lines = "warn" # A function past clippy.toml's threshold wants splitting.
# Allowed, as Zed allows them:
type_complexity = "allow" # GPUI's callback types are long by nature; aliases would only hide them.
large_enum_variant = "allow" # Boxing to even out variants costs an allocation for little gain here.

# gpui-kit's components, as published at 0.9.0, with this app's changes on
# top: its popup menus drawn as macOS draws its own (the tick column beside
# the icon, the metrics, the highlight), which nothing outside the crate can
# reach (Mike, 12 Nov: the Inbox's sort menu "not spaced properly", and no
# tick). `git log -p desktop/vendor` shows what's ours: the first commit
# there is the crate as published. On a gpui-kit bump, copy the new version
# in from ~/.cargo/registry/src and put those changes back on it.
#
# gpui-kit's base, the same way: the first commit under vendor/gpui-base is
# 0.9.0 as published. Ours on top: a TextViewStyle switch for the hairline
# the kit draws under every link, which Swift's replies don't have (Mike,
# 12 Nov: "the links are underlined in the GPUI version"). And a selection
# takes in a soft-wrapped row's first character, which GPUI places at the end
# of the row above (`wrapped_row_starts`, `drawn_position`; Mike, 13 Nov:
# "can't select all the way to the start of the line"). And a test
# snapshot's `visible_bounds`, what's drawn of an element inside its clips,
# so scripted clicks land on it rather than its whole middle, which for one
# scrolled half out of a pane is over its neighbour (13 Nov).
# And links in a SelectableText (`links`), drawn in a colour and followed on a
# click that isn't a drag, for the web addresses in Mike's bubble (16 Nov).
# And a paste longer than a textarea scrolled to its end: `scroll_to` clamped
# its target with the old text's height and left the box at the top (Mike,
# 17 Nov: a dictated brain dump showed its start, the end cut off).
# And a press whose release a click handler stopped (a PR tab's close) is
# ended by the next press, not taken for a drag still going on: the link
# clicked next did nothing until clicked again (Mike, 19 Nov;
# `released_unseen` in text_selection.rs).
# And a press on a link in text sends a sheen across its words, which Mike
# picked from four mockups (19 Nov; `text/link_glint.rs`).
# And ScrollBounce::smooth_wheel, easing each mouse wheel scroll over a few
# frames: Mike's Razer sends a notch as pixel scrolls 30 times a second, the
# first 20 to 90 px, and each landed whole in one frame (27 Nov). With
# ScrollbarHandle::jumps and note_jump, so a jump to the end, a track click,
# a thumb drag or a selection stops what's left of it.
# And an input keeps a right-click to itself (`input/input.rs`): the press
# went on to a dock panel's menu, which opened with the input's own and took
# its focus, so nothing picked from the Mac's menu reached the box (Wayne,
# 25 Nov; mikecann/threadbear#94).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }
# gpui-pre 0.3.11 as published, with file drags switching out of keyboard
# modality before hover hit tests (window.rs). Otherwise a drop after typing
# reaches no target. Keep this patch when updating the snapshot. Also
# Window::element_opacity made public, for the sidebar's turning arcs
# (gpui/src/spinner.rs).
# And ListState::scroll_px_offset_for_scrollbar reading an anchor past the
# last item (following the tail, before the next layout) as the end of the
# range, not a viewport beyond it: ScrollBounce took that gap for a pull past
# the transcript's bottom and stretched it the wrong way (Ian, 17 Nov).
# And an `img` with an id steps a GIF's frames whether or not its window is
# the key one (elements/img.rs): upstream played them only in the active
# window, so a GIF beside another app stayed still. It wakes its view when the
# next frame is due rather than drawing at every display frame (one timer
# kept across draws), on the executor's clock, starts its clock again after a
# long gap, and shows a 0 ms frame for 100 ms, as browsers do
# (gpui/tests/gif_frames.rs).
# And ScrollSource::Wheel, for a mouse wheel that reports pixels as a trackpad
# does (the review canvas zooms on a wheel and pans on a trackpad).
# And a tooltip checks the pointer against where its element is now, not where
# it was when the pointer arrived (elements/div.rs, `tooltip_source_bounds`):
# a click that opened a row moved its heading as the transcript followed its
# tail, and the heading's tip came up over the findings under the pointer and
# stayed (23 Nov). Its delayed show checks that too before it shows.
# And scroll events immediately activate InputRateTracker's high-rate state
# (window.rs): otherwise scrolling an inactive or freshly woken window hits the
# 33.3 ms throttle on Frame 2 waiting for 6 events, piling wheel deltas into a
# jerk (Mike, 26 Nov).
# And a cached view records every entity it reads, even one read earlier in
# the same frame (app.rs, `detect_accessed_entities`). Upstream left those
# out, so the main panel forgot the thread pane it shows: after a pause the
# pane's notify reached no window, and the transcript stood still under a
# trackpad, then jumped (rows/list_wheel_tests.rs, from Cristian Sotomayor).
# And ListState::jumps and note_jump, counting every move other than
# set_offset_from_scrollbar, so gpui-base's wheel glide stops when the view
# is moved some other way (27 Nov).
# And key dispatch recomputes its focus path after keystroke interceptors
# move focus. Simulated IME input only reaches the text handler painted for
# the current focus, so a native HTML page can keep its shortcuts without
# editing the review reply through a stale GPUI handler (window.rs,
# key_dispatch.rs focus-interception regressions).
# And Window::add_tooltip_exclusion records visible native child bounds
# during prepaint; tooltip placement avoids those bounds (window.rs).
gpui-pre = { path = "vendor/gpui-pre" }
# gpui-pre-macos 0.3.11 as published, except that with a native view inside
# the window holding the keyboard (a web panel's page), a key without ⌘ or
# Control isn't GPUI's key equivalent: it goes to that view. Otherwise
# Backspace and the arrows went to a GPUI text box out of sight (Mike, 19 Nov,
# the YouTube panel). See another_view_has_the_keyboard in its window.rs.
# And a scroll with no gesture phase or momentum is ScrollSource::Wheel
# (events.rs): Mike's Razer wheel reports pixels, so it looked like a trackpad.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# gpui-pre-windows 0.3.11 as published (its first commit under vendor/), except
# that the pointer leaving the window (or a file drag leaving it) sends
# MouseExited and then a move to where it went (events.rs,
# `dispatch_pointer_left`, `pointer_left_to`). Upstream only cleared the
# window's hovered flag, so a row's hover buttons and its tooltip stayed up
# after the pointer went off the window onto the desktop (Mike's XPS, 25 Nov).
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# gpui-pre-apple 0.3.11 as published, except that the Metal display link asks
# for the screen's full frame rate (display_link.rs). By default it drew at 60 on
# Mike's 120 Hz MacBook screen, and scrolling looked juddery (25 Nov).
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }

# Scripted screenshots run in debug apps, often at background priority. An
# unoptimized PNG encode stalled the app for 30 seconds (14 Nov). Optimize
# its filtering and CRC routines; generic encoding still uses the app's
# debug settings, so the fixed filter and worker in automation matter too.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
